// Hikâye: en dipten başlıyorsun (Zibo her şeyi çalmış, boş bir tavan arası). Her dünya bir yer: ev → köy → yol → Zibo'nun konağı.
// Her dünyada ilerledikçe o dünyanın arka planı buzdan çözülüp renklenir. 20. seviye: ZİBO SAVAŞI.
const WORLDS = [
  ['room_attic', 'Boş Tavan Arası', 'Empty Attic'], ['room_kitchen', 'Soğuk Mutfak', 'Cold Kitchen'], ['room_living', 'Oturma Odası', 'Living Room'], ['yard', 'Karlı Avlu', 'Snowy Yard'],
  ['story_morning', 'Köy Sabahı', 'Village Morning'], ['story1', 'Oyuncak Kamyonu', 'Toy Truck'], ['story2', 'Açık Pencere', 'Open Window'], ['story_trail', 'Kar İzleri', 'Snow Tracks'],
  ['village_map', 'Köy Haritası', 'Village Map'], ['story_hall', 'Belediye Binası', 'Town Hall'], ['story_fest', 'Noel Pazarı', 'Christmas Market'], ['road', 'Zibo\'nun Yolu', 'Zibo\'s Road'],
  ['story3', 'Mor Malikâne', 'Purple Mansion'], ['story4', 'Gizli Kapı', 'Secret Door'], ['room_throne', 'Taht Odası', 'Throne Room'], ['room_treasure', 'Hazine Odası', 'Treasure Room'], ['hub_bg', 'Zibo\'nun Konağı', 'Zibo\'s Manor']
];
const WN = 50, PER = 20;
const TINTS = ['', 'hue-rotate(40deg) saturate(1.2)', 'hue-rotate(-40deg)', 'hue-rotate(180deg) saturate(.8)'];
function world(w) { const k = w % WORLDS.length, round = Math.floor(w / WORLDS.length); const W = WORLDS[k]; return { img: '../assets/scenes/' + W[0] + '.webp', name: (TR ? W[1] : W[2]) + (round ? ' ' + ['', 'II', 'III', 'IV'][round] : ''), tint: TINTS[round % TINTS.length] }; }
// seviye tanımı (her seviye için sabit: aynı seviye hep aynı kural)
function levelDef(n) {
  const w = Math.floor((n - 1) / PER), i = (n - 1) % PER, d = Math.min(1, w / 30), e = Math.min(1, 0.25 + (n - 1) / 40);   // d: 0 → 1 zorluk; e: ilk 30 seviye yumuşak giriş
  const J = v => Math.round(v * e);
  if (i === PER - 1) return { type: 'boss', ice: (w ? 3 : 2) + Math.round(d * 4), time: 60 + Math.round(d * 30), drop: Math.max(2.4, 6 - d * 3), junk: J(6 + Math.round(d * 10)) };
  const t = i % 5;
  if (t === 4) return { type: 'survive', time: 30 + Math.min(60, w * 3 + (i > 10 ? 15 : 0)), drop: Math.max(2.4, 6.5 - d * 3.5), junk: J(4 + Math.round(d * 8)) };
  if (t === 2) return { type: 'score', target: 100 + w * 45 + i * 6, moves: 20 + Math.round(d * 4), junk: J(4 + Math.round(d * 10)) };
  if (t === 3) return { type: 'gift', gifts: 3 + Math.min(6, Math.floor(w / 3)), junk: J(5 + Math.round(d * 12)) };
  return { type: 'ice', ice: Math.min(9, 2 + Math.floor(w / 2) + (i > 10 ? 1 : 0)), junk: J(Math.min(24, 3 + Math.round(w * 1.2 + i * 0.3))) };
}
let LD = null, goalN = 0, goalHave = 0, tLeft = 0, dropT = 0, movesLeft = 0, timerOn = false;
function setupLevel() {
  LD = levelDef(lvl); goalHave = 0; timerOn = false;

  for (let k = 0; k < (LD.junk || 0); k++) { const c = free(); if (!c) break; board[c[1]][c[0]] = { col: Math.floor(Math.random() * COLORS.length) }; }
  const nIce = LD.ice || 0, nGift = LD.gifts || 0;
  for (let k = 0; k < nIce; k++) { const c = free(); if (c) board[c[1]][c[0]] = { ice: true, who: k % FRIENDS.length }; }
  for (let k = 0; k < nGift; k++) { const c = free(); if (c) board[c[1]][c[0]] = { gift: true, col: k % COLORS.length }; }
  for (let i = 0; i < N; i++) { if (board[i].every(v => v)) board[i][(i * 3) % N] = null; if (board.every(r => r[i])) board[(i * 5) % N][i] = null; }

  $('app').style.filter = '';
}
// her saniye: zamanlı seviyede süre azalır, Zibo tahtaya blok fırlatır
setInterval(() => {

  if (tLeft <= 0) { tLeft = 0; if (LD.type === 'survive' || (LD.type === 'boss' && goalHave >= (LD.ice || 0))) { gameOn = false; setTimeout(levelWin, 500); } else if (LD.type === 'boss') { gameOn = false; setTimeout(gameOver, 300); } }

function ziboDrop() {
  const empty = []; for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!board[y][x]) empty.push([x, y]);
  if (!empty.length) return;
  const [x, y] = rnd(empty); board[y][x] = { col: Math.floor(Math.random() * COLORS.length), junk: true };

}
function goalCheck() {

  if (LD.type === 'boss' && goalHave >= (LD.ice || 0)) won = true;

function goalIntro() {

function levelWin() {
  sfx('big', 1, 0.8); buzz([30, 30, 30, 30, 120]); zibo('cry', L.z[3]);
  const st = revived ? 1 : LD.type === 'score' ? (movesLeft >= 5 ? 3 : movesLeft >= 2 ? 2 : 1) : (combo >= 2 || score > goalN * 40 ? 3 : 2);
  const sl = store.get('lvst', {}); sl[lvl] = Math.max(sl[lvl] || 0, st); store.set('lvst', sl);

function startLevel() { newGame('level'); goalIntro(); }
// ---- HARİTA ----
function showHome(anim) {

// (28 Kas) AÇILIŞ SİNEMASI (~11 sn): neşeli köy → Zibo fırlar → buz dalgası → arkadaşlar buzda → Zibo altınla kaçar → buz çatlar, oyun başlar
