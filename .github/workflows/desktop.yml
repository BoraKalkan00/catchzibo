# PC (Windows) sürümü: her güncellemede derlenir. İndirme:
#   https://github.com/BoraKalkan00/catchzibo/releases/download/pc-build/ZibosRaid-win64.zip
# Steam'e yüklerken bu zip'in içindeki klasör "depot" olarak kullanılır.
name: PC surumu (Windows)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Oyun dosyalarını kopyala
        shell: bash
        run: |
          mkdir -p game
          rsync -a ../ game/ --exclude .git --exclude .github --exclude app --exclude desktop --exclude cizim --exclude store --exclude tools --exclude '*.md' || (cd .. && tar --exclude=.git --exclude=.github --exclude=app --exclude=desktop --exclude=cizim --exclude=store --exclude=tools -cf - . | (cd desktop/game && tar -xf -))
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --win dir --x64 --publish never
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path "dist/win-unpacked/*" -DestinationPath "../ZibosRaid-win64.zip" -Force
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-build
          name: Zibo's Raid PC test sürümü
          body: Windows için en yeni sürüm. Zip'i aç, "Zibo's Raid.exe" dosyasını çalıştır. Her güncellemede otomatik yenilenir.
          files: ZibosRaid-win64.zip
          make_latest: false
