# Her güncellemede telefona kurulabilir bir APK üretir.
# Telefondan indirme linki (her zaman en yeni sürüm):
#   https://github.com/BoraKalkan00/catchzibo/releases/latest/download/catchzibo.apk
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Oyun dosyalarını uygulamaya kopyala
        run: |
          mkdir -p www
          rsync -a ../ www/ --exclude .git --exclude .github --exclude app --exclude '*.md'

      - name: Capacitor kur ve Android projesini oluştur
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Dikey ekran ve sürüm ayarları
        run: |
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"0.1.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle

      - name: APK derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: catchzibo-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: APK'yı sabit indirme linkine koy
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ../catchzibo.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: Catch Zibo! test sürümü
          body: Telefona kurulacak en yeni test sürümü. Her güncellemede otomatik yenilenir.
          files: catchzibo.apk
          make_latest: true
